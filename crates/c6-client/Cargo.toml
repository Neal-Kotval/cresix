[package]
name = "c6-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
c6-core = { path = "../c6-core" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = "1"

[dev-dependencies]
httpmock = "0.7"
