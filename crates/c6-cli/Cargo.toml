[package]
name = "c6-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "c6_cli"

[[bin]]
name = "c6"
path = "src/bin/c6.rs"

[[bin]]
name = "git-credential-c6"
path = "src/bin/git-credential-c6.rs"

[dependencies]
c6-client = { path = "../c6-client" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
