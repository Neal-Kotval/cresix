name: cresix

services:
  c6:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The process must bind the container interface; Docker publishes it only
      # to C6_BIND_ADDRESS (loopback by default).
      C6_BIND: "0.0.0.0"
      C6_PORT: "8787"
      C6_WEB_DIST: /opt/c6/web
      C6_DATA_DIR: /var/lib/c6
      C6_PUBLIC_BASE_URL: ${C6_PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      # Required for the container-interface HTTP hop. This does not publish
      # C6 beyond the host binding above.
      C6_INSECURE_HTTP: "1"
    ports:
      - "${C6_BIND_ADDRESS:-127.0.0.1}:${C6_PORT:-8787}:8787"
    volumes:
      - c6-data:/var/lib/c6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/c6-runner"]
    environment:
      C6_RUNNER_SOCKET: /run/c6/runner.sock
      C6_RUNNER_STATE_DIR: /var/lib/c6-runner
      C6_RUNNER_AUTH_KEY_FILE: /run/c6/runner.key
    volumes:
      - c6-data:/var/lib/c6:ro
      - runner-state:/var/lib/c6-runner
      - runner-socket:/run/c6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "test", "-S", "/run/c6/runner.sock"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s
    restart: unless-stopped

volumes:
  c6-data:
  runner-state:
  runner-socket:
