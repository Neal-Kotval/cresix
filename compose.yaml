name: cresix

services:
  c6:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      C6_PORT: "8787"
      C6_WEB_DIST: /opt/c6/web
      C6_DATABASE_URL: postgres://c6:${POSTGRES_PASSWORD:-c6-dev}@control-db:5432/c6
      C6_OBJECT_ENDPOINT: http://object-store:9000
      C6_REGISTRY: http://registry:5000
      C6_PUBLIC_BASE_URL: ${C6_PUBLIC_BASE_URL:-http://localhost:8787}
      C6_GITHUB_CLIENT_ID: ${C6_GITHUB_CLIENT_ID:-}
      C6_GITHUB_CLIENT_SECRET: ${C6_GITHUB_CLIENT_SECRET:-}
    ports:
      - "${C6_PORT:-8787}:8787"
    volumes:
      - git-data:/var/lib/c6/git
      - runner-socket:/run/c6
    depends_on:
      control-db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/c6-runner"]
    environment:
      C6_RUNNER_SOCKET: /run/c6/runner.sock
    volumes:
      - runner-socket:/run/c6
      - project-data:/var/lib/c6/projects
    restart: unless-stopped

  control-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: c6
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c6-dev}
      POSTGRES_DB: c6
    volumes:
      - control-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c6"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  workload-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: c6_provisioner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-c6-dev}
    volumes:
      - workload-db:/var/lib/postgresql/data
    restart: unless-stopped

  object-store:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: c6
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-c6-dev-secret}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  registry:
    image: registry:2
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  control-db:
  workload-db:
  object-data:
  registry-data:
  git-data:
  project-data:
  runner-socket:
