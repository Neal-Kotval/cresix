version = 1
name = "c6-build-team"
description = "Build, secure, verify, and document standalone C6 and its optional connected Cloud mode."
orchestrator = "lead"
max_parallel = 10

[policy]
default_branch_write = "explicit-owner-authority"
agent_repository_write = "owned-scope"
secrets = "never-share"
network = "declared-only"
require_independent_release_review = true

[[agents]]
id = "lead"
config = "agents/lead.toml"

[[agents]]
id = "product-architect"
config = "agents/product-architect.toml"

[[agents]]
id = "rust-platform"
config = "agents/rust-platform.toml"

[[agents]]
id = "core-contracts"
config = "agents/core-contracts.toml"

[[agents]]
id = "git-service"
config = "agents/git-service.toml"

[[agents]]
id = "server-control-plane"
config = "agents/server-control-plane.toml"

[[agents]]
id = "cloud-contracts"
config = "agents/cloud-contracts.toml"

[[agents]]
id = "cloud-control-plane"
config = "agents/cloud-control-plane.toml"

[[agents]]
id = "connector-relay"
config = "agents/connector-relay.toml"

[[agents]]
id = "web-experience"
config = "agents/web-experience.toml"

[[agents]]
id = "cloud-web-experience"
config = "agents/cloud-web-experience.toml"

[[agents]]
id = "identity-security"
config = "agents/identity-security.toml"

[[agents]]
id = "runtime-isolation"
config = "agents/runtime-isolation.toml"

[[agents]]
id = "qa-reliability"
config = "agents/qa-reliability.toml"

[[agents]]
id = "docs-operator"
config = "agents/docs-operator.toml"

[[agents]]
id = "release-reviewer"
config = "agents/release-reviewer.toml"

[[gates]]
name = "team-contract"
command = "bash teams/c6-build-team/qa/validate-team.sh"

[[gates]]
name = "repository-checks"
command = "bash teams/c6-build-team/qa/check.sh"

[[gates]]
name = "security-regression"
command = "bash teams/c6-build-team/qa/security.sh"

[[gates]]
name = "connected-cloud"
command = "bash teams/c6-build-team/qa/cloud.sh"

[[gates]]
name = "headless-browser"
command = "bash teams/c6-build-team/qa/e2e.sh"

[[gates]]
name = "live-regression"
command = "bash teams/c6-build-team/qa/smoke.sh"

[[gates]]
name = "self-hosted-dogfood"
command = "bash teams/c6-build-team/qa/dogfood.sh"
