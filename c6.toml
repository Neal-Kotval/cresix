version = 1

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"

[[services]]
name = "c6"
command = "/usr/local/bin/c6-server"
port = 8787
health_path = "/healthz"

[services.resources]
cpu = 1.0
memory_mb = 512

[[jobs]]
name = "local-qa"
kind = "command"
command = "./qa/run.sh"
concurrency = "forbid"
timeout_seconds = 1800

[jobs.resources]
cpu = 2.0
memory_mb = 2048
